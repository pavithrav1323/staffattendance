<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="background-color" content="#ffffff" />
    <title>Staff Attendance</title>
  </head>
  <body>
    <div id="root">
      <!-- Splash Screen -->
      <div id="splash-screen" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      ">
        <img
          src="/images/logo.jpeg"
          alt="Kolej Sains Kesihatan Bersekutu Sungai Buloh logo"
          style="
            width: 160px;
            height: auto;
            max-width: 90vw;
            object-fit: contain;
            margin-bottom: 24px;
          "
        />
        <h1 style="
          color: #1e293b;
          font-size: 1.5rem;
          font-weight: 600;
          margin: 0 0 16px 0;
          text-align: center;
        ">Staff Attendance</h1>
        <p style="
          color: #64748b;
          font-size: 0.9rem;
          margin: 0;
        ">Loading...</p>
      </div>
    </div>
    <div
      id="update-error"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1e293b;
        z-index: 10000;
        padding: 24px;
        text-align: center;
      "
    >
      <h1 style="font-size: 1.5rem; margin-bottom: 16px;">Application updated</h1>
      <p style="color: #64748b; max-width: 400px; margin-bottom: 24px;">
        The application has been updated. Please reload the page to continue.
      </p>
      <button
        onclick="location.reload()"
        style="
          padding: 10px 24px;
          background: #2563eb;
          color: #ffffff;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 1rem;
        "
      >
        Reload Application
      </button>
    </div>

    <script>
      (function () {
        function showUpdateError() {
          var splash = document.getElementById('splash-screen');
          if (splash) splash.style.display = 'none';
          var error = document.getElementById('update-error');
          if (error) error.style.display = 'flex';
        }

        function isScriptError(event) {
          var target = event.target || event.srcElement;
          return target && target.tagName === 'SCRIPT';
        }

        window.addEventListener(
          'error',
          function (event) {
            if (isScriptError(event)) {
              console.warn('[App] Failed to load script:', event.filename || (event.target && event.target.src));
              showUpdateError();
            }
          },
          true
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason ? String(event.reason) : '';
          if (/load|chunk|module|import/i.test(reason)) {
            console.warn('[App] Chunk load error:', reason);
            showUpdateError();
          }
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
